name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m py_compile app/*.py tests/*.py harness/*.py reference_check.py
      - name: Run tests
        run: python -m pytest -q
      - name: Run reference checks
        run: python reference_check.py
